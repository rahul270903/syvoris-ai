services:
  - type: web
    name: syvoris-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: syvoris-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: '["https://syvoris-ai.vercel.app", "http://localhost:5173", "https://*.vercel.app"]'

databases:
  - name: syvoris-postgres
    databaseName: syvoris_crm
    user: syvoris_app
    plan: free
