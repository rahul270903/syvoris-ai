version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: syvoris-postgres
    restart: always
    environment:
      POSTGRES_DB: syvoris_production
      POSTGRES_USER: syvoris_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecureProductionDbPassword2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syvoris_app -d syvoris_production"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syvoris-internal

  redis:
    image: redis:7-alpine
    container_name: syvoris-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-SecureRedisAuth2026!}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SecureRedisAuth2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syvoris-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syvoris-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://syvoris_app:${POSTGRES_PASSWORD:-SecureProductionDbPassword2026!}@postgres:5432/syvoris_production
      POSTGRES_RLS_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:-syvoris-enterprise-secret-key-production-hardened-32-chars-long}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_live_syvoris_production_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_production_secret_key}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-pk_live_syvoris_production_key}
      CORS_ORIGINS: '["https://crm.syvoris.ai", "https://app.syvoris.ai"]'
    networks:
      - syvoris-internal
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syvoris-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    networks:
      - syvoris-internal

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  certs:
    driver: local

networks:
  syvoris-internal:
    driver: bridge
