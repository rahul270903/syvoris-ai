apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: syvoris-ingress
  namespace: syvoris-production
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - crm.syvoris.ai
      secretName: syvoris-tls-certs
  rules:
    - host: crm.syvoris.ai
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: syvoris-backend-svc
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: syvoris-frontend-svc
                port:
                  number: 80
