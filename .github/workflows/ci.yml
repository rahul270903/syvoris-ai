name: SYVORIS Ai CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-quality-gate:
    name: Frontend Verification & Production Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Verify Architecture & Route Invariants (132 Unique Routes)
        run: npm run check:project

      - name: TypeScript Strict Compilation & Typecheck
        run: npm run typecheck

      - name: Build Production Frontend Distribution
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          echo "Production frontend build completed and verified successfully."

  backend-quality-gate:
    name: Backend Migrations & Test Suite with RLS (Python 3.10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: syvoris_ci_db
          POSTGRES_USER: syvoris_app
          POSTGRES_PASSWORD: syvoris_ci_secure_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt flake8

      - name: Backend Syntax & Runtime Safety Check
        run: |
          flake8 backend/app --count --select=E9,F63,F7 --show-source --statistics

      - name: Verify Alembic Single Migration Head
        run: |
          python -m alembic -c backend/alembic.ini heads

      - name: Test Alembic Forward Migrations (upgrade head)
        env:
          DATABASE_URL: postgresql+asyncpg://syvoris_app:syvoris_ci_secure_2026@localhost:5432/syvoris_ci_db
        run: |
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Test Alembic Reversible Migration Rollback (downgrade base)
        env:
          DATABASE_URL: postgresql+asyncpg://syvoris_app:syvoris_ci_secure_2026@localhost:5432/syvoris_ci_db
        run: |
          python -m alembic -c backend/alembic.ini downgrade base

      - name: Re-apply Alembic Migrations for Full Test Execution
        env:
          DATABASE_URL: postgresql+asyncpg://syvoris_app:syvoris_ci_secure_2026@localhost:5432/syvoris_ci_db
        run: |
          python -m alembic -c backend/alembic.ini upgrade head

      - name: Run Full Pytest Regression Suite with Native PostgreSQL Kernel RLS
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://syvoris_app:syvoris_ci_secure_2026@localhost:5432/syvoris_ci_db
          REDIS_TEST_URL: redis://localhost:6379/0
          SECRET_KEY: syvoris-enterprise-ci-cd-secret-key-32-chars-long
        run: |
          pytest -v --tb=short

  ci-status-gate:
    name: Continuous Integration Quality Gate
    needs: [frontend-quality-gate, backend-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: All CI Checks Passed
        run: |
          echo "=========================================================="
          echo "SYVORIS Ai Enterprise CRM CI Quality Gate: SUCCESS"
          echo "Frontend: verified & built"
          echo "Backend: migrations forward/rollback verified, RLS passed"
          echo "=========================================================="
